# SwiftLint configuration; strictness comes from the --strict flag in
# Scripts/ci-local.sh (any warning fails the run).
included:
  - Apps
  - Modules
excluded:
  - Derived
  - Spike
  # Generated content (Plan 4 Task 3): the committed Tokens.swift is byte-fixed
  # by external/linko-core/design-tokens/generate.py and cannot satisfy
  # identifier_name (s4/s8) or nesting (Tokens.Colors.Light); freshness is
  # enforced by Scripts/check-tokens.sh instead.
  - Modules/DesignSystem/Sources/Tokens.swift
line_length:
  warning: 160
  error: 200
identifier_name:
  # Plan-pinned wire/domain names and conventional shorthands below the
  # default 3-character minimum (id is already excluded by default).
  excluded:
    - id
    - db
    - to
    - ts
    - a
    - b
    - up
