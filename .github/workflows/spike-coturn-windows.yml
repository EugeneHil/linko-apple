# Throwaway (spike/LNK-3, never merged): native Windows build of coturn for the TURN spike.
name: spike-coturn-windows

on:
  workflow_dispatch:
  push:
    branches: [spike/LNK-3-webrtc-callkit]
    paths: [.github/workflows/spike-coturn-windows.yml]

permissions:
  contents: read

env:
  COTURN_TAG: "4.18.0"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Fetch coturn
        run: git clone --depth 1 --branch $env:COTURN_TAG https://github.com/coturn/coturn.git coturn
      - name: Dependencies (vcpkg)
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libevent[openssl,thread]" openssl pthreads --triplet x64-windows'
      - name: Configure
        run: cmake -S coturn -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Get-ChildItem build -Recurse -Include turnserver.exe,turnutils_uclient.exe,*.dll | Copy-Item -Destination dist
          Get-ChildItem dist
          Get-FileHash dist\turnserver.exe -Algorithm SHA256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coturn-windows-x64
          path: dist
          retention-days: 7
